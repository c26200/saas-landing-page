<!DOCTYPE html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d9d4; padding: 24px; }

  /* 1 Signal */

  /* 2 Collins */

  .t2 h1 em { font-style: normal; color: #E63B2E; }
  .t2 .mock { position: absolute; right: 14px; top: 72px; width: 150px; height: 100px; border: 1px solid #3A3732; background: #1C1917; padding: 6px; }
  .t2 .mock .bar { height: 4px; background: #3A3732; margin-bottom: 4px; }
  .t2 .mock .bar.g { background: #E63B2E; width: 60%; }
  .t2 .sub { font-size: 7px; color: #A9A29A; max-width: 210px; margin-top: 10px; line-height: 1.6; }
  .t2 .row { position: absolute; left: 14px; bottom: 10px; right: 14px; display: flex; gap: 10px; font-size: 5.5px; color: #8A837B; border-top: 1px solid #332F2A; padding-top: 5px; }

  /* 3 Linear */
  .t3 { background: #0B0D12; color: #E8EAF0; padding: 10px 14px; font-family: "Inter", sans-serif; }
  .t3 .nav { display: flex; justify-content: space-between; font-size: 6px; color: #7C8595; }
  .t3 .h { font-size: 27px; font-weight: 600; letter-spacing: -.03em; text-align: center; margin-top: 22px; line-height: 1.05; }
  .t3 .h span { color: #7C5CFF; }
  .t3 .sub { text-align: center; font-size: 7px; color: #8A93A3; margin-top: 6px; }
  .t3 .cta { display: block; width: 90px; margin: 10px auto 0; background: #7C5CFF; color: #fff; text-align: center; padding: 5px; font-size: 6.5px; border-radius: 5px; }

  .t3 .mock .l { height: 3px; background: #242A36; margin-bottom: 4px; }

  /* 4 Stripe */
  .t4 { background: #FFFFFF; color: #0A2540; padding: 12px 14px; font-family: "Inter", sans-serif; position: relative; }
  .t4 .mesh { position: absolute; inset: 0; background: radial-gradient(circle at 80% 10%, rgba(99,91,255,.18), transparent 45%), radial-gradient(circle at 20% 90%, rgba(28,176,246,.14), transparent 40%); }
  .t4 .nav { position: relative; display: flex; justify-content: space-between; font-size: 6px; color: #425466; }
  .t4 .h { position: relative; font-size: 26px; font-weight: 700; letter-spacing: -.03em; margin-top: 20px; max-width: 260px; }

  .t4 .code { position: absolute; right: 14px; bottom: 14px; width: 170px; background: #0A2540; color: #9AE6B4; font-family: "JetBrains Mono", monospace; font-size: 5.5px; padding: 7px; border-radius: 5px; line-height: 1.8; }

  /* 5 Friendly Candy */

  .t5 .nav { display: flex; justify-content: space-between; font-size: 6px; font-weight: 700; color: #58CC02; }
  .t5 .h { font-family: "Baloo 2", sans-serif; font-size: 30px; font-weight: 800; line-height: .95; color: #4B4B4B; margin-top: 20px; }
  .t5 .h span { color: #58CC02; }
  .t5 .sub { font-size: 7px; color: #777; max-width: 230px; margin-top: 7px; line-height: 1.6; }
  .t5 .btn { display: inline-block; margin-top: 10px; background: #58CC02; color: #fff; padding: 6px 14px; border-radius: 10px; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 8px; box-shadow: 0 4px 0 #46A302; }
  .t5 .mascot { position: absolute; right: 22px; top: 78px; width: 90px; height: 90px; }
  .t5 .mascot .face { width: 90px; height: 90px; border-radius: 24px; background: #58CC02; }
  .t5 .mascot .eye { position: absolute; top: 28px; width: 14px; height: 14px; background: #fff; border-radius: 50%; }
  .t5 .mascot .eye.l { left: 22px; } .t5 .mascot .eye.r { right: 22px; }
  .t5 .mascot .pupil { position: absolute; top: 32px; width: 7px; height: 7px; background: #222; border-radius: 50%; }
  .t5 .mascot .pupil.l { left: 27px; } .t5 .mascot .pupil.r { right: 27px; }
  .t5 .cards { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; gap: 6px; }
  .t5 .cards div { flex: 1; border: 2px solid #E5E5E5; border-radius: 10px; padding: 5px; font-size: 5.5px; font-weight: 700; }
  .t5 .cards b { display: block; font-family: "Baloo 2", sans-serif; font-size: 7px; color: #58CC02; }

  /* 6 POPEYE */
  .t6 { background: #F6F3EA; color: #111; padding: 10px 12px; font-family: "Archivo Narrow", sans-serif; }
  .t6 .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #111; padding-bottom: 3px; }
  .t6 .head b { font-size: 15px; letter-spacing: -.02em; }
  .t6 .head span { font-size: 5.5px; letter-spacing: .12em; }
  .t6 h1 { font-size: 26px; line-height: .95; margin-top: 6px; letter-spacing: -.02em; }
  .t6 h1 mark { background: #F2C94C; padding: 0 3px; }
  .t6 .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-top: 6px; }
  .t6 .note { font-family: "Caveat", cursive; font-size: 9px; color: #E63946; transform: rotate(-2deg); }
  .t6 .note.blue { color: #1D4ED8; transform: rotate(1deg); }
  .t6 .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid #111; }
  .t6 .grid9 div { border: 1px solid #111; padding: 3px; font-size: 5px; }
  .t6 .grid9 .y { background: #F2C94C; } .t6 .grid9 .k { background: #111; color: #F6F3EA; }
  .t6 .list { position: absolute; left: 12px; bottom: 8px; right: 12px; display: flex; justify-content: space-between; font-size: 5.5px; border-top: 2px solid #111; padding-top: 3px; }
</style>
